server {
    listen 80;
    root /usr/share/nginx/html;

    # a single page app: unknown paths are routes of the app, not files
    location / {
        try_files $uri /index.html;
    }

    # hashed assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
